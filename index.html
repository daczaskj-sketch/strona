<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DACZA FOREST</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:black;
      color:white;
      overflow:hidden;
      font-size:16px;
    }

    /* BACKGROUND (IDENTYCZNY SYSTEM) */
    .grid{
      position:fixed;
      width:100%;
      height:100%;
      background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size:60px 60px;
      z-index:-2;
    }

    .vignette{
      position:fixed;
      width:100%;
      height:100%;
      background:radial-gradient(circle at center, transparent 40%, black 100%);
      z-index:-1;
    }

    /* HEADER — IDENTYCZNY Z INNYMI STRONAMI */
    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:80px;
      padding:0 50px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:9999;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(3px);
    }

    .logo img{
      height:70px;
      width:auto;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    nav{
      display:flex;
      gap:40px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:700;
      font-size:15px;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity:0.9;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    /* HERO */
    .hero{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    .hero h1{
      font-size:110px;
      font-weight:900;
      line-height:1;
      margin-bottom:25px;
    }

    .hero h1 span{
      font-style:italic;
      opacity:0.85;
    }

    .hero p{
      font-size:22px;
      color:#cfcfcf;
      margin-bottom:50px;
      max-width:700px;
    }

    /* BUTTONS — SPÓJNE Z UI */
    .buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .buttons a{
      text-decoration:none;
      color:white;
      border:1px solid rgba(255,255,255,0.15);
      padding:16px 34px;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      transition:0.3s;
      backdrop-filter:blur(5px);
    }

    .buttons a:hover{
      background:white;
      color:black;
      transform:translateY(-3px);
    }

    /* DISCORD */
    .bottom-bar{
      position:absolute;
      bottom:40px;
      left:0;
      width:100%;
      display:flex;
      justify-content:flex-end;
      padding:0 50px;
    }

    .discord{
      border:1px solid rgba(255,255,255,0.15);
      padding:14px 26px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:600;
      transition:0.3s;
    }

    .discord:hover{
      background:white;
      color:black;
    }

    /* MOBILE */
    @media(max-width:800px){

      header{
        padding:0 20px;
      }

      nav{
        gap:20px;
      }

      .hero h1{
        font-size:52px;
      }

      .hero p{
        font-size:18px;
      }

      .bottom-bar{
        padding:0 20px;
      }
    }

  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="vignette"></div>

  <header>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Logo">
      </a>
    </div>

    <nav>
      <a href="soon.html">GALERIA</a>
      <a href="soon.html">HISTORIA</a>
      <a href="faq.html">FAQ</a>
    </nav>

  </header>

  <section class="hero">

    <h1>Projekt <span>Dacza</span></h1>

    <p>Budowa leśnej bazy i dokumentacja całego projektu w czasie rzeczywistym.</p>

    <div class="buttons">

      <a href="https://www.youtube.com/@dacza_forest" target="_blank">YouTube</a>
      <a href="https://www.tiktok.com/@dacza_forest" target="_blank">TikTok</a>
      <a href="https://www.instagram.com/dacza_forest" target="_blank">Instagram</a>
      <a href="https://www.instagram.com/dacza_forest" target="_blank">Wsparcie</a>

    </div>

  </section>



</body>
</html>
