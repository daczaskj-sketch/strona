<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dacza Forest — GALERIA</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#000;
      color:white;
      overflow-x:hidden;
      padding-top:90px;
      font-size:16px;
    }

    /* BACKGROUND (JEDEN SYSTEM) */
    body::before{
      content:"";
      position:fixed;
      width:100%;
      height:100%;
      background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size:60px 60px;
      z-index:-2;
    }

    body::after{
      content:"";
      position:fixed;
      width:100%;
      height:100%;
      background:radial-gradient(circle at center, transparent 0%, black 85%);
      z-index:-1;
    }

    /* HEADER — IDENTYCZNY */
    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:80px;
      padding:0 50px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:9999;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(3px);
    }

    .logo img{
      height:70px;
      width:auto;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    nav{
      display:flex;
      gap:40px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:700;
      font-size:15px;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity:0.9;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    /* HERO */
    .hero{
      padding:140px 10% 40px;
    }

    .hero h1{
      font-size:70px;
      font-weight:900;
    }

    .hero p{
      margin-top:10px;
      color:#aaa;
      font-size:18px;
      max-width:700px;
      line-height:1.6;
    }

    /* FILTERS */
    .filters{
      padding:0 10%;
      margin-bottom:40px;
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .filters button{
      background:transparent;
      border:1px solid rgba(255,255,255,0.15);
      color:white;
      padding:10px 18px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
      font-family:'Inter',sans-serif;
      font-weight:600;
    }

    .filters button:hover{
      background:white;
      color:black;
    }

    /* GALLERY */
    .gallery{
      padding:0 10% 120px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .card{
      position:relative;
      overflow:hidden;
      border-radius:16px;
      height:340px;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.02);
    }

    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:0.5s;
      filter:brightness(0.75);
      user-select:none;
      -webkit-user-drag:none;
    }

    .card:hover img{
      transform:scale(1.08);
      filter:brightness(1);
    }

    .overlay{
      position:absolute;
      bottom:0;
      left:0;
      width:100%;
      padding:20px;
      background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .overlay h3{
      font-size:20px;
      font-weight:800;
      margin-bottom:4px;
    }

    .overlay p{
      font-size:14px;
      color:#bdbdbd;
    }

    /* FOOTER */
    footer{
      padding:40px 10%;
      border-top:1px solid rgba(255,255,255,0.1);
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:20px;
    }

    .discord{
      border:1px solid rgba(255,255,255,0.2);
      padding:12px 20px;
      border-radius:10px;
      text-decoration:none;
      color:white;
      font-weight:600;
      transition:0.3s;
    }

    .discord:hover{
      background:white;
      color:black;
    }

    /* MOBILE */
    @media(max-width:800px){

      header{
        padding:0 20px;
      }

      nav{
        gap:20px;
      }

      .hero h1{
        font-size:42px;
      }

      .gallery{
        grid-template-columns:1fr;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Logo">
      </a>
    </div>

    <nav>
      <a href="galeria.html">GALERIA</a>
      <a href="historia.html">HISTORIA</a>
      <a href="faq.html">FAQ</a>
    </nav>

  </header>

  <section class="hero">

    <h1>Galeria projektu</h1>

    <p>
      Dokumentacja budowy bazy w lesie — każdy etap projektu i praca w terenie.
    </p>

  </section>



  <section class="gallery">

    <div class="card">
      <img src="images/Pierwsza proba.jpg" alt="">
      <div class="overlay">
        <h3>Pierwsza próba</h3>
        <p>10.08.2025</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="">
      <div class="overlay">
        <h3>Prace terenowe</h3>
        <p>20.03.2026</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="">
      <div class="overlay">
        <h3>Las nocą</h3>
        <p>25.03.2026</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8" alt="">
      <div class="overlay">
        <h3>Konstrukcja</h3>
        <p>04.04.2026</p>
      </div>
    </div>

  </section>



</body>
</html>
