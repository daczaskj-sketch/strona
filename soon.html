<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DACZA FOREST — Wkrótce</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:black;
      color:white;
      overflow:hidden;
    }

    /* BACKGROUND */
    .grid{
      position:fixed;
      width:100%;
      height:100%;
      background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size:60px 60px;
      z-index:-2;
    }

    .vignette{
      position:fixed;
      width:100%;
      height:100%;
      background:radial-gradient(circle at center, transparent 40%, black 100%);
      z-index:-1;
    }

    /* HEADER */
    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:80px;
      padding:0 50px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:9999;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(3px);
    }

    .logo img{
      height:70px;
      width:auto;
      display:block;
    }

    nav{
      display:flex;
      gap:40px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:700;
      font-size:15px;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity:0.9;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    /* HERO */
    .hero{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    .hero h1{
      font-size:100px;
      font-weight:900;
      line-height:1;
      margin-bottom:25px;
    }

    .hero h1 span{
      font-style:italic;
      opacity:0.85;
    }

    .hero p{
      font-size:22px;
      color:#cfcfcf;
      max-width:700px;
      margin-bottom:40px;
    }

    .tag{
      display:inline-block;
      padding:10px 20px;
      border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;
      font-size:14px;
      letter-spacing:2px;
      text-transform:uppercase;
      opacity:0.9;
      margin-bottom:30px;
    }

    /* BUTTON */
    .btn{
      text-decoration:none;
      color:white;
      border:1px solid rgba(255,255,255,0.15);
      padding:16px 34px;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      transition:0.3s;
      backdrop-filter:blur(5px);
    }

    .btn:hover{
      background:white;
      color:black;
      transform:translateY(-3px);
    }

    /* MOBILE */
    @media(max-width:800px){

      header{
        padding:0 20px;
      }

      nav{
        gap:20px;
      }

      .hero h1{
        font-size:48px;
      }

      .hero p{
        font-size:18px;
      }
    }

  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="vignette"></div>

  <header>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Logo">
      </a>
    </div>

    <nav>
      <a href="galeria.html">GALERIA</a>
      <a href="historia.html">HISTORIA</a>
      <a href="faq.html">FAQ</a>
    </nav>

  </header>

  <section class="hero">

    <div class="tag">Wkrótce</div>

    <h1>Strona <span>w budowie</span></h1>

    <p>
      Pracujemy nad kolejną częścią projektu Dacza Forest.
      Już wkrótce pojawi się tutaj nowa zawartość.
    </p>

    <a class="btn" href="index.html">Powrót na stronę główną</a>

  </section>

</body>
</html>
